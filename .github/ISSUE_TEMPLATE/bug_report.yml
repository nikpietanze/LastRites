name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: /rites status
      description: Paste the output of `/rites status`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you?
      options: ["World PvP", "Battleground", "Arena", "Not PvP"]
  - type: textarea
    id: debug
    attributes:
      label: Debug output
      description: If a kill didn't trigger a rite, turn on `/rites debug`, get another kill, and paste what it printed.
      render: text
  - type: textarea
    id: errors
    attributes:
      label: Lua errors
      description: Paste any error text (BugSack/BugGrabber help here).
      render: text
