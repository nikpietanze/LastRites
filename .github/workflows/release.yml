name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build the release zip as a workflow artifact without creating
  # a GitHub release or uploading to CurseForge. Use it to check packaging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: |
          lua5.1 tests/validate_prayers.lua .
          lua5.1 tests/test_core.lua .

      # Builds LastRites-<tag>-forever.zip, attaches it to a GitHub release and
      # uploads it to CurseForge (needs the CF_API_KEY secret and the
      # X-Curse-Project-ID line in the TOC).
      - name: Package and publish
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Package only (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Upload dry-run zip
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LastRites-dry-run
          path: .release/*.zip
